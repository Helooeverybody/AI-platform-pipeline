name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev,ml]"

      - name: Check format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q
  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --build-arg "GIT_SHA=$(git rev-parse HEAD)" -t mini-ml-runtime:ci .

      - name: Smoke test
        run: |
          output="$(docker run --rm mini-ml-runtime:ci)"
          echo "$output"
          test "$output" = "hello from a job"
          docker run --rm mini-ml-runtime:ci python -c "import mini_ml"

      - name: Check revision label
        run: |
          image_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' mini-ml-runtime:ci)"
          echo "$image_sha"
          test "$image_sha" = "$(git rev-parse HEAD)"

      - name: CPU training smoke test
        run: |
          mkdir -p outputs/ci-cpu-classifier
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD/outputs/ci-cpu-classifier:/outputs" \
            mini-ml-runtime:ci \
            python examples/cpu_classifier/train.py --seed 42 --output-dir /outputs
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("outputs/ci-cpu-classifier")
          metrics = json.loads((output / "metrics.json").read_text())
          model = json.loads((output / "model.json").read_text())
          assert 0.0 <= metrics["validation_accuracy"] <= 1.0
          assert metrics["train_samples"] + metrics["validation_samples"] == 300
          assert model["n_features"] == 8
          PY
          docker run --rm \
            --volume "$PWD/outputs/ci-cpu-classifier:/outputs:ro" \
            mini-ml-runtime:ci \
            python examples/cpu_classifier/predict.py \
            --model /outputs/model.json --features 0 0 0 0 0 0 0 0
