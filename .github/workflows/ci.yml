name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q